plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mimavault'
    compileSdk 36

    defaultConfig {
        applicationId "com.mimavaultapp"
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName "A9.9.3"
    }

    signingConfigs {
        release {
            storeFile file('../keystore/mimavault-release.jks')
            storePassword 'MimaVault@2026!K$'
            keyAlias 'mimavault'
            keyPassword 'MimaVault@2026!K$'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Gson: 与 PC 端 1:1 字段互通 JSON 序列化
    implementation 'com.google.code.gson:gson:2.10.1'
    // ZXing 二维码
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // 离线拼音分组（条目列表按首字母索引）
    implementation files('libs/pinyin4j-2.5.1.jar')
}
